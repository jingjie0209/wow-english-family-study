<!doctype html>

<head>
<meta charset="utf-8">

<title>WOW English 第一季 · 完整资料入口</title>
<style>
:root{--ink:#1d1d1f;--muted:#6e6e73;--line:#e5e5e7;--green:#17604d}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif}
main{max-width:1240px;margin:0 auto;padding:0 24px 60px}header{padding:30px 0 26px;border-bottom:1px solid var(--line)}
.brand{margin:0;font-size:13px;font-weight:850}.brand b{color:var(--green)}.brand span{color:var(--muted);font-weight:500}
h1{margin:20px 0 6px;font-size:34px;letter-spacing:-.02em}.lead{margin:0;color:#5f6460;font-size:14px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;padding:28px 0 0}
.card{border:1px solid var(--line);border-radius:9px;overflow:hidden;text-decoration:none;color:inherit;background:#fff}
.card img{display:block;width:100%;height:132px;object-fit:cover;border-bottom:1px solid var(--line)}
.card div{padding:12px}.card strong{display:block;font-size:13px}.card small{display:block;margin-top:5px;color:var(--muted);font-size:11px}
nav{padding:18px 0 0;display:flex;gap:10px}nav a{display:inline-flex;align-items:center;height:31px;padding:0 11px;border:1px solid #dce4de;border-radius:6px;color:var(--green);font-size:12px;font-weight:750;text-decoration:none}
</style>
</head>
<body><main><header><p class="brand"><b>WOW</b> <span>ENGLISH</span></p><h1>第一季 · 完整资料入口</h1><p class="lead">33 集详情页底部都有本集可打印资料；这里提供按集入口和整本源文件。</p><nav><a href="level-01-package.html">第一季完整包</a><a href="materials/comic-transcript/WOW English Yellow Season 1 Comic Transcript.pdf">整本漫画台词本</a><a href="materials/parent-extension/WOW English Season 1 Parent Extension.pdf">整本亲子拓展</a><a href="materials/wordcards/WOW English Yellow Level 1 Word Cards.pdf">整本单词卡</a></nav></header><div class="grid" id="grid"></div></main><script>fetch('materials/episode-material-mapping.json').then(r=>r.json()).then(d=>{const pkg=[];const g=document.getElementById('grid');for(let i=1;i<=33;i++){const a=document.createElement('a');a.className='card';a.href=`episodes/episode-${String(i).padStart(2,'0')}.html#materials`;a.innerHTML=`<img loading="lazy" src="assets/daily/day-${String(i).padStart(2,'0')}.png" alt="Day ${i}"><div><strong>Day ${i}</strong><small>漫画、亲子拓展、单词卡</small></div>`;g.appendChild(a)}});</script></body></html>
