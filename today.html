      const offsets = [
        { label: "今天的新课", offset: 0, note: "完整学习" },
        { label: "近期复习", offset: 1, note: "前 1 集" },
        { label: "间隔复习", offset: 3, note: "前 3 集" },
        { label: "轻量维护", offset: 7, note: "前 7 集" },
      ];
      const levelSelect = document.querySelector("#level-select");
      const episodeSelect = document.querySelector("#episode-select");
      const todayGrid = document.querySelector("#today-grid");

      function renderEpisodeOptions(preferredIndex) {
        const episodes = levels[levelSelect.value];
        episodeSelect.innerHTML = episodes.map((episode, index) =>
          '<option value="' + index + '">' + episode.no + ' · ' + episode.title + '</option>'
        ).join("");
        episodeSelect.value = String(Math.min(preferredIndex ?? 0, episodes.length - 1));
        renderToday();
      }

      function renderToday() {
        const episodes = levels[levelSelect.value];
        const currentIndex = Number(episodeSelect.value);
        todayGrid.innerHTML = offsets.map(({ label, offset, note }) => {
          const episode = episodes[currentIndex - offset];
          if (!episode) {
            return '<div class="today-item is-empty"><span class="today-tag">' + label + '</span><span class="today-title">尚无对应旧课</span><span class="today-meta">' + note + '</span></div>';
          }
          return '<a class="today-item" href="' + episode.href + '"><span class="today-tag">' + label + '</span><span class="today-title">' + episode.no + ' · ' + episode.title + '</span><span class="today-meta">' + note + ' · 点击进入 ›</span></a>';
        }).join("");
        localStorage.setItem("wow-study-level", levelSelect.value);
        localStorage.setItem("wow-study-episode", episodeSelect.value);
      }

      const savedLevel = localStorage.getItem("wow-study-level");
      if (savedLevel && levels[savedLevel]) levelSelect.value = savedLevel;
      const savedEpisode = Number(localStorage.getItem("wow-study-episode") || 0);
      renderEpisodeOptions(savedEpisode);
      levelSelect.addEventListener("change", () => renderEpisodeOptions(0));
      episodeSelect.addEventListener("change", renderToday);
    </script>
