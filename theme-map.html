.theme-card .desc{margin:0 0 12px;color:#5f6460;font-size:13px;line-height:1.6}
.theme-card table{width:100%;border-collapse:collapse}
.theme-card th,.theme-card td{padding:8px 10px;border-bottom:1px solid #ededee;text-align:left;font-size:12px;line-height:1.45;vertical-align:top}
.theme-card th{background:#f7f8f7;color:#39443d;white-space:nowrap}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:750;white-space:nowrap}

.filter-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{height:31px;padding:0 14px;display:inline-flex;align-items:center;border:1px solid #dce4de;border-radius:6px;background:#fff;color:var(--green);font-size:12px;font-weight:750;cursor:pointer}

.note{margin-top:24px;padding:12px 14px;border-left:3px solid #d9e4dc;background:#fafbfa;color:#5f6460;font-size:12px;line-height:1.6}

let currentFilter='';
function render(list){
  document.getElementById('theme-list').innerHTML=list.map(t=>{
    const rows=t.units.map(u=>{
      const pill=u.daily==='✅'?'<span class="pill ok">✅</span>':'<span class="pill none">—</span>';
      return `<tr><td>第${u.s}季 ${u.name}</td><td>${u.unit}</td><td>${u.topic}</td><td>${u.eps}集</td><td>${pill}</td><td><a href="${u.link}">打开</a></td></tr>`;
    }).join('');
    return `<div class="theme-card visible" data-cat="${t.id}" data-name="${t.name}"><h3>${t.name}</h3><p class="desc">${t.desc}</p><table><thead><tr><th>季</th><th>Unit</th><th>主题</th><th>集数</th><th>教材重点</th><th>入口</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }).join('');
}
function filterThemes(q){
  q=q.toLowerCase();
  document.querySelectorAll('.theme-card').forEach(c=>{
    const match=!q||c.textContent.toLowerCase().includes(q);
    c.style.display=match?'block':'none';
  });
}
function filterCat(cat){
  document.querySelectorAll('.theme-card').forEach(c=>{
    c.style.display=c.dataset.cat===cat?'block':'none';
  });
  document.querySelectorAll('.chip').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
}
function showAll(){
  document.querySelectorAll('.theme-card').forEach(c=>c.style.display='block');
  document.querySelectorAll('.chip').forEach((b,i)=>b.classList.toggle('active',i===0));
}
